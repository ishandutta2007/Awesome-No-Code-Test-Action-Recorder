<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>

    <style>
      @keyframes pulseSlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.08); }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(-25px) translateX(15px); opacity: 0.7; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      }
      @keyframes recordPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(1.25); }
      }
      @keyframes beamMove {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      .bg-orb1 {
        animation: pulseSlow 8s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .bg-orb2 {
        animation: pulseSlow 10s ease-in-out infinite reverse;
        transform-origin: 1000px 260px;
      }
      .p1 { animation: floatParticle 6s ease-in-out infinite; }
      .p2 { animation: floatParticle 8s ease-in-out infinite 2s; }
      .p3 { animation: floatParticle 7s ease-in-out infinite 4s; }
      .rec-dot {
        animation: recordPulse 2s ease-in-out infinite;
        transform-origin: 100px 60px;
      }
      .beam-line {
        stroke-dasharray: 80 120;
        animation: beamMove 8s linear infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: -1px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        fill: #94a3b8;
        letter-spacing: 0.5px;
      }
      .badge-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #cbd5e1;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#techGrid)" />

  <!-- Animated Glowing Orbs (Deep in Background) -->
  <circle class="bg-orb1" cx="200" cy="90" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
  <circle class="bg-orb2" cx="1020" cy="250" r="160" fill="#818cf8" opacity="0.15" filter="url(#glow)" />
  <circle class="bg-orb1" cx="600" cy="300" r="100" fill="#c084fc" opacity="0.10" filter="url(#glow)" />

  <!-- Dynamic Network / Flow Beams in Background -->
  <g opacity="0.25">
    <path class="beam-line" d="M 50 180 Q 300 80 600 180 T 1150 180" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="beam-line" d="M 50 220 Q 300 320 600 220 T 1150 220" fill="none" stroke="#c084fc" stroke-width="2" />
  </g>

  <!-- Floating Ambient Particles -->
  <circle class="p1" cx="240" cy="270" r="4" fill="#38bdf8" />
  <circle class="p2" cx="950" cy="90" r="5" fill="#818cf8" />
  <circle class="p3" cx="720" cy="70" r="3" fill="#c084fc" />
  <circle class="p1" cx="420" cy="80" r="3.5" fill="#38bdf8" />
  <circle class="p2" cx="820" cy="290" r="4" fill="#f43f5e" />

  <!-- Floating Live Recording Indicator Badge -->
  <g transform="translate(480, 42)">
    <rect width="240" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle class="rec-dot" cx="24" cy="17" r="6" fill="#ef4444" filter="url(#softGlow)" />
    <text x="40" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f87171" letter-spacing="1.5">LIVE ACTION RECORDER</text>
  </g>

  <!-- Foreground Title -->
  <g transform="translate(600, 150)" text-anchor="middle">
    <text class="title-text" font-size="44" y="0">
      Awesome No-Code Test Action Recorder
    </text>
    <text class="subtitle-text" font-size="18" y="44">
      Curated Playwright, Cypress, Chrome DevTools &amp; AI-Driven Codeless Testing Tools
    </text>
  </g>

  <!-- Feature Pill Badges (Foreground) -->
  <g transform="translate(195, 255)">
    <!-- Pill 1: Record & Playback -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="21" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
      <circle cx="24" cy="21" r="5" fill="#38bdf8" />
      <text x="38" y="26" class="badge-label">Record &amp; Playback</text>
    </g>

    <!-- Pill 2: Browser Codegen -->
    <g transform="translate(200, 0)">
      <rect width="180" height="42" rx="21" fill="url(#badgeGrad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5" />
      <circle cx="24" cy="21" r="5" fill="#818cf8" />
      <text x="38" y="26" class="badge-label">Browser Codegen</text>
    </g>

    <!-- Pill 3: E2E Automation -->
    <g transform="translate(400, 0)">
      <rect width="185" height="42" rx="21" fill="url(#badgeGrad)" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5" />
      <circle cx="24" cy="21" r="5" fill="#a855f7" />
      <text x="38" y="26" class="badge-label">E2E Automation</text>
    </g>

    <!-- Pill 4: AI & Scriptless -->
    <g transform="translate(605, 0)">
      <rect width="200" height="42" rx="21" fill="url(#badgeGrad)" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1.5" />
      <circle cx="24" cy="21" r="5" fill="#ec4899" />
      <text x="38" y="26" class="badge-label">AI &amp; Scriptless Tests</text>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="354" width="1200" height="6" rx="3" fill="url(#accentGrad)" />
</svg>
