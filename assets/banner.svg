<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="badgeGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#334155" stop-opacity=".6"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="softGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".25" stroke-width=".75" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes pulseSlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.08)}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0);opacity:.2}50%{transform:translateY(-25px) translateX(15px);opacity:.7}}@keyframes recordPulse{0%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.25)}}@keyframes beamMove{0%{stroke-dashoffset:400}}.bg-orb1{animation:pulseSlow 8s ease-in-out infinite;transform-origin:200px 100px}.bg-orb2{animation:pulseSlow 10s ease-in-out infinite reverse;transform-origin:1000px 260px}.p1{animation:floatParticle 6s ease-in-out infinite}.p2{animation:floatParticle 8s ease-in-out infinite 2s}.p3{animation:floatParticle 7s ease-in-out infinite 4s}.rec-dot{animation:recordPulse 2s ease-in-out infinite;transform-origin:100px 60px}.beam-line{stroke-dasharray:80 120;animation:beamMove 8s linear infinite}.title-text{font-weight:800;fill:#fff;letter-spacing:-1px}.badge-label,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle-text{font-weight:400;fill:#94a3b8;letter-spacing:.5px}.badge-label{font-weight:600;font-size:13px;fill:#cbd5e1}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="360" fill="url(#techGrid)" rx="16"/><circle cx="200" cy="90" r="140" fill="#38bdf8" class="bg-orb1" filter="url(#glow)" opacity=".12"/><circle cx="1020" cy="250" r="160" fill="#818cf8" class="bg-orb2" filter="url(#glow)" opacity=".15"/><circle cx="600" cy="300" r="100" fill="#c084fc" class="bg-orb1" filter="url(#glow)" opacity=".1"/><g opacity=".25"><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 50 180 Q 300 80 600 180 T 1150 180" class="beam-line"/><path fill="none" stroke="#c084fc" stroke-width="2" d="M 50 220 Q 300 320 600 220 T 1150 220" class="beam-line"/></g><circle cx="240" cy="270" r="4" fill="#38bdf8" class="p1"/><circle cx="950" cy="90" r="5" fill="#818cf8" class="p2"/><circle cx="720" cy="70" r="3" fill="#c084fc" class="p3"/><circle cx="420" cy="80" r="3.5" fill="#38bdf8" class="p1"/><circle cx="820" cy="290" r="4" fill="#f43f5e" class="p2"/><g transform="translate(480, 42)"><rect width="240" height="34" fill="#1e293b" stroke="#334155" stroke-width="1.2" rx="17"/><circle cx="24" cy="17" r="6" fill="#ef4444" class="rec-dot" filter="url(#softGlow)"/><text x="40" y="22" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">LIVE ACTION RECORDER</text></g><g text-anchor="middle"><text y="0" class="title-text" font-size="44" transform="translate(600, 150)">Awesome No-Code Test Action Recorder</text><text y="44" class="subtitle-text" font-size="18" transform="translate(600, 150)">Curated Playwright, Cypress, Chrome DevTools &amp; AI-Driven Codeless Testing Tools</text></g><g><g transform="translate(195, 255) translate(0, 0)"><rect width="180" height="42" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1.5" rx="21"/><circle cx="24" cy="21" r="5" fill="#38bdf8"/><text x="38" y="26" class="badge-label">Record &amp; Playback</text></g><g transform="translate(195, 255) translate(200, 0)"><rect width="180" height="42" fill="url(#badgeGrad)" stroke="#818cf8" stroke-opacity=".4" stroke-width="1.5" rx="21"/><circle cx="24" cy="21" r="5" fill="#818cf8"/><text x="38" y="26" class="badge-label">Browser Codegen</text></g><g transform="translate(195, 255) translate(400, 0)"><rect width="185" height="42" fill="url(#badgeGrad)" stroke="#a855f7" stroke-opacity=".4" stroke-width="1.5" rx="21"/><circle cx="24" cy="21" r="5" fill="#a855f7"/><text x="38" y="26" class="badge-label">E2E Automation</text></g><g transform="translate(195, 255) translate(605, 0)"><rect width="200" height="42" fill="url(#badgeGrad)" stroke="#ec4899" stroke-opacity=".4" stroke-width="1.5" rx="21"/><circle cx="24" cy="21" r="5" fill="#ec4899"/><text x="38" y="26" class="badge-label">AI &amp; Scriptless Tests</text></g></g><rect width="1200" height="6" x="0" y="354" fill="url(#accentGrad)" rx="3"/></svg>